[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acr-capture"
version = "0.1.0"
description = "Playwright (headless Chromium) capture tooling for the AČR / Aktivní záloha channel map"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michal Bernhard" }]
dependencies = [
  "playwright>=1.49",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
acr-capture = "acr_capture.cli:main"

[tool.setuptools.packages.find]
include = ["acr_capture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
